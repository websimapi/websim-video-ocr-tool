<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video OCR Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "tesseract.js": "https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.esm.min.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Video OCR Tool</h1>
        
        <div class="setup-section">
            <h2>1. Select Video</h2>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div id="videoContainer" class="hidden">
            <h2>2. Select Region for OCR</h2>
            <div id="videoWrapper">
                <video id="video" controls></video>
                <div id="selectionBox" class="hidden"></div>
            </div>
            <div class="button-row">
                <button id="selectRegion">Select Region</button>
                <button id="startCapture" disabled>Start OCR Capture</button>
                <button id="stopCapture" disabled>Stop Capture</button>
            </div>
        </div>

        <div id="resultsContainer" class="hidden">
            <h2>OCR Results</h2>
            <div id="results"></div>
            <button id="clearResults">Clear Results</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
